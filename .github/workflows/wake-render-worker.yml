name: Wake Render Worker

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Render worker
        run: |
          echo "Despertando worker en Render..."
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            --retry 3 --retry-delay 60 \
            https://iabd-pia.onrender.com/health
