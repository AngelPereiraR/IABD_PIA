version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    container_name: job-offers-backend
    ports:
      - "7860:7860"
    environment:
      # Cargar desde .env
      - DATABASE_URL=${DATABASE_URL}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_TOKEN_JSON=${GOOGLE_TOKEN_JSON}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - JINA_API_KEY=${JINA_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PORT=7860
    volumes:
      # Datos persistentes
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vite Frontend Development
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: job-offers-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:7860
    volumes:
      # Hot reload - sincronizar código fuente
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/.env:/app/.env
      - ./frontend/node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: job-offers-network
